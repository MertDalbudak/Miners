<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Miners icon renderer</title>
  <!-- Dev tool: renders the app icon from the 3D miner. Open with `npm run dev` at /tools/icon.html?variant=any|maskable -->
  <style>
    html, body { margin: 0; background: transparent; }
    #icon {
      position: relative;
      width: 1024px;
      height: 1024px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, #FFD978 0%, #F2A93B 34%, #B8621E 68%, #5A2A0C 100%);
    }
    #icon.any { border-radius: 230px; }
    #icon::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 120%, rgba(40, 14, 2, 0.55), rgba(40, 14, 2, 0) 55%);
      pointer-events: none;
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="icon"><canvas id="c" width="1024" height="1024"></canvas></div>
  <script type="module" src="./icon.js"></script>
</body>
</html>
